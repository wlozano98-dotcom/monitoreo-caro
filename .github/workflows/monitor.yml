name: Monitoreo

on:
  schedule:
    - cron: "17 */2 * * *" # cada 2 horas, al minuto 17 (UTC)
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write # para dejar analisis/contexto.md antes de cada análisis de Claude

concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger, clasificar y resumir
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: python monitor.py
      # La rutina de Claude corre a las 13:00, 17:00 y 01:00 UTC (8, 12 y 20 h de Ecuador): las corridas de las
      # 12:17, 16:17 y 00:17 UTC le dejan listo el contexto. También al correrlo a mano.
      - name: Preparar contexto para el análisis de Claude
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$h" != "00" ] && [ "$h" != "12" ] && [ "$h" != "16" ]; then
            echo "No toca preparar contexto a las $h UTC"; exit 0
          fi
          python analisis_claude.py preparar
          git config user.name "monitoreo-bot"
          git config user.email "monitoreo-bot@users.noreply.github.com"
          git add analisis/contexto.md
          git diff --cached --quiet && exit 0
          git commit -m "Contexto para el análisis de Claude ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push origin HEAD:main
