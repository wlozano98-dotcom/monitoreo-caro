name: Monitoreo

on:
  schedule:
    - cron: "17 */2 * * *" # cada 2 horas, al minuto 17 (UTC)
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write # para dejar analisis/contexto.md antes de cada análisis de Claude

concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La hora se toma al EMPEZAR: GitHub a veces arranca tarde (16:51 en vez de 16:17) y monitor.py tarda ~15 min;
      # si se mirara el reloj en el paso del contexto ya serían las 17 y se lo saltaría (pasó el 23 oct).
      - name: Hora de inicio
        run: echo "HORA_INICIO=$(date -u +%H)" >> $GITHUB_ENV
      - name: Recoger, clasificar y resumir
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: python monitor.py
      # La rutina de Claude corre a las 11:20, 17:20, 23:20 y 03:20 UTC (6, 12, 18 y 22 h de Ecuador): las corridas
      # de las 10:17, 16:17, 22:17 y 02:17 UTC le dejan listo el contexto. También al correrlo a mano.
      # Desde el 29 oct GitHub solo dispara ~1 de cada 3 corridas y a cualquier hora: si el contexto tiene más de 5 h,
      # se prepara en la corrida que haya (si no, Claude analizaba datos de hace 2 días y nadie lo notaba).
      - name: Preparar contexto para el análisis de Claude
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          h=$HORA_INICIO
          horas=$(python3 analisis_claude.py edad)
          echo "Contexto con $horas h"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$h" != "10" ] && [ "$h" != "16" ] && [ "$h" != "22" ] && [ "$h" != "02" ] && [ "$horas" -le 5 ]; then
            echo "No toca preparar contexto (corrida de las $h UTC)"; exit 0
          fi
          python analisis_claude.py preparar
          git config user.name "monitoreo-bot"
          git config user.email "monitoreo-bot@users.noreply.github.com"
          git add analisis/contexto.md
          git diff --cached --quiet && exit 0
          git commit -m "Contexto para el análisis de Claude ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push origin HEAD:main
      # Vigilante: si monitor.py dejó avisos.txt, la corrida queda en rojo y GitHub manda un correo (decisión de Andrés).
      - name: Avisar si algo falla
        if: always()
        run: |
          [ -f avisos.txt ] || exit 0
          echo "El vigilante encontró problemas:"
          cat avisos.txt
          while IFS= read -r l; do echo "::error::${l#- }"; done < avisos.txt
          exit 1
